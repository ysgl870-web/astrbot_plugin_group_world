<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>群聊世界 · ysgl 控制中心</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="./logo.png" alt="群聊世界" class="brand-logo" />
        <div>
          <div class="brand-title">群聊世界</div>
          <div class="brand-sub">ysgl · Control Center</div>
        </div>
      </div>
      <div class="authority-card">
        <div class="eyebrow">ACCESS LEVEL</div>
        <div class="authority-title">插件超级管理员</div>
        <div class="authority-copy">独立于会话管理员的高权限管理层</div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div>作者：<b>ysgl</b></div>
        <div id="versionText">群聊世界 V1.6.2</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">ASTRBOT PLUGIN PAGE</div>
          <h1 id="pageTitle">概览</h1>
          <p id="pageDesc">世界状态、活跃度、经济与系统健康度。</p>
        </div>
        <div class="top-actions">
          <select id="groupSelect" title="群世界操作目标；玩家中心不按群拆分"></select>
          <button class="ghost" id="refreshBtn">刷新数据</button>
          <button class="ghost" id="importBtn">导入数据</button><button class="primary" id="exportBtn">导出数据</button>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="loginOverlay" class="overlay hidden">
    <div class="login-card">
      <div class="login-mark">🌎</div>
      <h2>群聊世界管理中心</h2>
      <p>这里是独立的插件高权限管理入口。请输入 Web 管理口令继续。</p>
      <input id="loginPassword" type="password" placeholder="Web 管理口令" autocomplete="current-password" />
      <button id="loginBtn" class="primary wide">解锁管理中心</button>
      <div id="loginHint" class="hint"></div>
    </div>
  </div>


  <div id="importModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><div><div class="eyebrow">DATA IMPORT</div><h2>导入数据</h2><p class="muted">支持本插件导出的 JSON 快照，也兼容 V1.5 旧版导出文件。导入前会自动生成安全备份。</p></div><button id="importModalClose" class="ghost">关闭</button></div>
      <div class="form-grid">
        <label>选择 JSON 文件<input id="importFile" type="file" accept="application/json,.json"></label>
        <label style="grid-column:1/-1">或直接粘贴 JSON<textarea id="importText" rows="12" placeholder="把 world-export-*.json 内容粘贴到这里"></textarea></label>
      </div>
      <div class="modal-actions"><button id="importRun" class="primary">开始导入</button><button id="importCancel" class="ghost">取消</button></div>
      <div id="importHint" class="hint"></div>
    </div>
  </div>

  <div id="playerModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><div><div class="eyebrow">PLAYER EDITOR</div><h2>编辑玩家数据</h2><p id="playerModalUser" class="muted"></p></div><button id="playerModalClose" class="ghost">关闭</button></div>
      <div class="form-grid">
        <label>昵称<input id="pf_name" type="text"></label>
        <label>等级<input id="pf_level" type="number" min="1" max="999"></label>
        <label>经验<input id="pf_exp" type="number" min="0"></label>
        <label>金币<input id="pf_coins" type="number" min="0"></label>
        <label>钻石<input id="pf_gems" type="number" min="0"></label>
        <label>当前体力<input id="pf_stamina" type="number" min="0"></label>
        <label>战斗生命<input id="pf_hp" type="number" min="0"></label>
        <label>战斗攻击<input id="pf_battle_attack" type="number" min="1"></label>
        <label>战斗防御<input id="pf_battle_defense" type="number" min="0"></label>
        <label>暴击率 %<input id="pf_battle_crit_rate" type="number" min="0" max="95" step="0.1"></label>
        <label>闪避率 %<input id="pf_battle_dodge_rate" type="number" min="0" max="80" step="0.1"></label>
        <label>战斗速度<input id="pf_battle_speed" type="number" min="1"></label>
        <label>PVP 积分<input id="pf_pvp_rating" type="number" min="0"></label>
        <label>PVP 连胜<input id="pf_pvp_streak" type="number" min="0"></label>
        <label>胜场<input id="pf_battle_wins" type="number" min="0"></label>
        <label>负场<input id="pf_battle_losses" type="number" min="0"></label>
        <label>平局<input id="pf_battle_draws" type="number" min="0"></label>
        <label>击杀<input id="pf_battle_kills" type="number" min="0"></label>
        <label>死亡<input id="pf_battle_deaths" type="number" min="0"></label>
        <label>死亡状态<input id="pf_death_state" type="number" min="0" max="1"></label>
        <label>复活时间戳<input id="pf_respawn_at" type="number" min="0"></label>
        <label>复活次数<input id="pf_revive_count" type="number" min="0"></label>
        <label>最大生命<input id="pf_max_hp" type="number" min="1"></label>
        <label>最大体力<input id="pf_max_stamina" type="number" min="1"></label>
        <label>幸运<input id="pf_luck" type="number" min="0"></label>
        <label>声望<input id="pf_renown" type="number" min="0"></label>
        <label>职业<input id="pf_profession" type="text"></label>
        <label>称号<input id="pf_title" type="text"></label>
        <label>连续签到<input id="pf_streak" type="number" min="0"></label>
        <label>总签到<input id="pf_total_checkin" type="number" min="0"></label>
        <label>教程状态<select id="pf_tutorial_status"><option value="pending">进行中</option><option value="completed">已完成</option><option value="skipped">已跳过</option></select></label>
        <label>教程页<input id="pf_tutorial_step" type="number" min="0" max="10"></label>
        <label>最后签到<input id="pf_last_checkin" type="text" placeholder="YYYY-MM-DD"></label>
        <label>新人保护截止<input id="pf_protected_until" type="text" placeholder="ISO 时间，可留空"></label>
        <label>今日探索次数<input id="pf_explore_count" type="number" min="0"></label>
        <label>探索统计日期<input id="pf_explore_day" type="text" placeholder="YYYY-MM-DD"></label>
        <label>累计探索<input id="pf_total_explores" type="number" min="0"></label>
        <label>累计小游戏<input id="pf_total_games" type="number" min="0"></label>
        <label>累计打工<input id="pf_total_work" type="number" min="0"></label>
        <label>累计 Boss 伤害<input id="pf_total_boss_damage" type="number" min="0"></label>
        <label>累计获得金币<input id="pf_total_earned_coins" type="number" min="0"></label>
        <label>累计消费金币<input id="pf_total_spent_coins" type="number" min="0"></label>
        <label>出战宠物 ID<input id="pf_active_pet_id" type="number" min="0" placeholder="留空=无"></label>
        <label>最后行为时间<input id="pf_last_action_at" type="text" placeholder="ISO 时间，可留空"></label>
      </div>
      <div class="modal-actions"><button id="playerSave" class="primary">保存全部数据</button><button id="playerResetTutorial" class="ghost">仅重开教程</button></div>
    </div>
  </div>


  <div id="groupModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><div><div class="eyebrow">WORLD SETTINGS</div><h2>群世界设置</h2><p id="groupModalGroup" class="muted"></p></div><button id="groupModalClose" class="ghost">关闭</button></div>
      <div class="form-grid">
        <label>世界天气<input id="gf_weather" type="text"></label>
        <label>世界地点<input id="gf_location" type="text"></label>
        <label>世界事件<input id="gf_event_enabled" type="checkbox"></label>
        <label>探索系统<input id="gf_explore_enabled" type="checkbox"></label>
        <label>怪物系统<input id="gf_monster_enabled" type="checkbox"></label>
        <label>怪物基础概率<input id="gf_monster_chance" type="number" min="0" max="100"></label>
        <label>最多怪物数量<input id="gf_monster_max" type="number" min="1" max="3"></label>
        <label>遇见多个怪概率<input id="gf_monster_multi" type="number" min="0" max="100"></label>
        <label>随机 NPC<input id="gf_npc_enabled" type="checkbox"></label>
        <label>NPC触发概率<input id="gf_npc_chance" type="number" min="0" max="100"></label>
        <label>NPC最短间隔(分钟)<input id="gf_npc_interval" type="number" min="5" max="1440"></label>
        <label>本群 AI<input id="gf_ai_enabled" type="checkbox"></label>
      </div>
      <div class="modal-actions"><button id="groupSave" class="primary">保存世界设置</button><button id="groupSpawnNpc" class="ghost">立即召唤 NPC</button><button id="groupEndEvent" class="ghost">结束当前事件</button><button id="groupClearNpc" class="ghost">让 NPC 离开</button></div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
